name: Feature request
description: Suggest a change or an addition to ticknet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: ticknet is a transport, not a netcode framework. State replication, interpolation, prediction, matchmaking and rooms are out of its scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What your game needs that ticknet does not let you do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, and its API if it adds one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other designs you considered.
